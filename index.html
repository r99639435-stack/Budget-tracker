<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f6b5c"><meta name="description" content="Private, offline-first personal budget tracker."><meta name="color-scheme" content="light dark">
<title>Budget Tracker</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--bg:#eef2f1;--card:#fff;--ink:#14201f;--mute:#5f7370;--line:#d5dedc;--accent:#0f6b5c;--accentText:#fff;--over:#b42350;--track:#e1e9e7;--shadow:0 3px 14px #14201f0b} :root[data-theme=dark]{color-scheme:dark;--bg:#0f1716;--card:#18221f;--ink:#e6efed;--mute:#9ab0ac;--line:#2a3a37;--accent:#4cc2ab;--accentText:#09231e;--over:#ff7a9a;--track:#263532;--shadow:0 3px 14px #0004}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1716;--card:#18221f;--ink:#e6efed;--mute:#9ab0ac;--line:#2a3a37;--accent:#4cc2ab;--accentText:#09231e;--over:#ff7a9a;--track:#263532;--shadow:0 3px 14px #0004}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}main{width:min(100%,600px);margin:auto;padding:14px 16px 30px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.top,.brand,.actions,.month,.row,.summary{display:flex;align-items:center}.top,.month,.row,.summary{justify-content:space-between}.top{margin:2px 0 14px}.brand{gap:10px;font-weight:750}.brand img{width:38px;height:38px}.actions{gap:8px}.ib{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-size:20px}.month{display:grid;grid-template-columns:44px 1fr 44px;gap:12px;margin-bottom:14px;text-align:center;font-weight:700}.hero,.card{border:1px solid var(--line);border-radius:17px;background:var(--card);box-shadow:var(--shadow)}.hero{padding:20px}.eyebrow,.meta,small{color:var(--mute)}.eyebrow{font-size:13px;font-weight:650}.big{font:700 clamp(38px,11vw,54px)/1.08 Georgia,serif;letter-spacing:-1.5px;margin:5px 0 16px;overflow-wrap:anywhere}.neg{color:var(--over)}.seg{display:flex;height:12px;gap:2px;overflow:hidden;border-radius:8px;background:var(--track)}.seg i{height:100%;min-width:2px}.summary{justify-content:flex-start;gap:28px;margin-top:12px;color:var(--mute);font-size:13px}.summary b{display:block;color:var(--ink);font-size:16px}h2{font-size:15px;margin:23px 2px 9px}.cat{padding:12px 14px;border-bottom:1px solid var(--line)}.cat:last-child,.tx:last-child{border:0}.row{gap:8px}.meta{margin-top:5px;font-size:13px}.bar{height:6px;overflow:hidden;margin-top:8px;border-radius:5px;background:var(--track)}.bar i{display:block;height:100%;border-radius:inherit}form{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}form .full{grid-column:1/-1}input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}.bud{width:100px;min-height:38px;padding:6px 9px;text-align:right}.primary{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accentText);font-weight:700}.tx{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}.del{width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-size:22px}.empty{padding:17px;color:var(--mute);font-size:14px}.chart{padding:12px}.chart svg{display:block;width:100%;height:auto}.legend{display:flex;gap:16px;padding:0 4px 8px;color:var(--mute);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stat{padding:10px;border-radius:12px;background:var(--bg);color:var(--mute);font-size:12px}.stat b{display:block;margin-top:3px;color:var(--ink);font-size:15px}.install{display:none;width:100%;margin-top:10px}.install.visible{display:block}.foot{margin:18px 4px 0;text-align:center;color:var(--mute);font-size:12px}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body><main>
<header class="top"><div class="brand"><img src="icon.svg" alt=""><span>Budget Tracker</span></div><div class="actions"><button class="ib" id="theme" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button></div></header>
<nav class="month" aria-label="Choose month"><button class="ib" id="prev" aria-label="Previous month">‹</button><span id="mlabel" aria-live="polite"></span><button class="ib" id="next" aria-label="Next month">›</button></nav>
<section class="hero"><div class="eyebrow">LEFT TO SPEND</div><div class="big" id="left"></div><div class="seg" id="seg" role="img"></div><div class="summary"><span>Budget<b id="tb"></b></span><span>Spent<b id="ts"></b></span></div></section>
<button class="primary install" id="install">Install Budget Tracker</button>
<h2>Spending history</h2><section class="card chart"><svg id="chart" viewBox="0 0 360 190" role="img" aria-label="Six-month spending compared with budget"></svg><div class="legend"><span><i style="background:#0f6b5c"></i>Spent</span><span><i style="background:#b8d9d2"></i>Budget</span></div><div class="stats" id="stats"></div></section>
<h2>Add expense</h2><section class="card"><form id="expenseForm"><input class="full" id="amt" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Amount" required aria-label="Amount"><select id="cat" aria-label="Category"></select><input id="date" type="date" required aria-label="Date"><input class="full" id="note" maxlength="120" placeholder="Note (optional)" aria-label="Note (optional)"><button class="primary full" type="submit">Add expense</button></form></section>
<h2>Categories &amp; monthly budgets</h2><section class="card" id="cats"></section><section class="card" style="margin-top:9px"><form id="categoryForm" style="grid-template-columns:1fr auto"><input id="cname" maxlength="40" placeholder="New category" required aria-label="New category"><button class="primary" style="padding:0 15px" type="submit">Add category</button></form></section>
<h2>Expenses this month</h2><section class="card" id="txs"></section><p class="foot">Your budget data stays on this device.</p>
</main>
<script>
'use strict';
const KEY='budget-tracker-v1',THEME='budget-tracker-theme',DEFAULT={cats:[{n:'Rent',b:1200},{n:'Groceries',b:400},{n:'Transport',b:120},{n:'Eating out',b:150},{n:'Fun',b:100}],tx:[]};
let S;try{const saved=JSON.parse(localStorage.getItem(KEY));S=saved&&Array.isArray(saved.cats)&&Array.isArray(saved.tx)?saved:DEFAULT}catch{S=DEFAULT}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};let month=today().slice(0,7);
const fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:2}),money=n=>fmt.format(n),color=i=>`hsl(${(i*47+160)%360},50%,48%)`,dateOf=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1)},keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{alert('Could not save. Please check available device storage.')}}
function esc(s){const d=document.createElement('span');d.textContent=String(s);return d.innerHTML}function txMonth(k){return S.tx.filter(t=>typeof t.d==='string'&&t.d.slice(0,7)===k).sort((a,b)=>b.d.localeCompare(a.d)||String(b.id).localeCompare(String(a.id)))}
function totals(k){return{spent:txMonth(k).reduce((a,t)=>a+(Number(t.a)||0),0),budget:S.cats.reduce((a,c)=>a+(Number(c.b)||0),0)}}
function chart(){const svg=$('chart');svg.replaceChildren();const ns='http://www.w3.org/2000/svg',add=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e);return e};add('title',{},'Monthly spending compared with budget for six months');const anchor=dateOf(month),vs=[];for(let i=5;i>=0;i--){const d=new Date(anchor.getFullYear(),anchor.getMonth()-i,1),k=keyOf(d);vs.push({label:d.toLocaleDateString(undefined,{month:'short'}),...totals(k)})}const max=Math.max(1,...vs.flatMap(v=>[v.spent,v.budget])),dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches),ink=dark?'#9ab0ac':'#5f7370',budget=dark?'#456c63':'#b8d9d2',top=15,bottom=145,h=bottom-top;[0,.5,1].forEach(f=>{let y=bottom-f*h;add('line',{x1:24,y1:y,x2:356,y2:y,stroke:dark?'#2a3a37':'#e1e9e7'});});vs.forEach((v,i)=>{const x=37+i*54,bh=v.budget/max*h,sh=v.spent/max*h;let r=add('rect',{x,y:bottom-bh,width:17,height:Math.max(v.budget?2:0,bh),rx:4,fill:budget});r.append(Object.assign(document.createElementNS(ns,'title'),{textContent:`${v.label}: ${money(v.budget)} budget`}));add('rect',{x:x+21,y:bottom-Math.max(v.spent?2:0,sh),width:17,height:Math.max(v.spent?2:0,sh),rx:4,fill:dark?'#4cc2ab':'#0f6b5c'});add('text',{x:x+19,y:bottom+18,'text-anchor':'middle',fill:ink,'font-size':10},v.label)});const t=totals(month);$('stats').innerHTML=`<div class="stat">Spent this month<b>${money(t.spent)}</b></div><div class="stat">Monthly budget<b>${money(t.budget)}</b></div>`}
function render(){const tx=txMonth(month),t=totals(month),sp=Object.create(null);S.cats.forEach(c=>sp[c.n]=0);tx.forEach(x=>sp[x.c]=(sp[x.c]||0)+(Number(x.a)||0));$('mlabel').textContent=dateOf(month).toLocaleDateString(undefined,{month:'long',year:'numeric'});$('left').textContent=money(t.budget-t.spent);$('left').className='big'+(t.budget<t.spent?' neg':'');$('tb').textContent=money(t.budget);$('ts').textContent=money(t.spent);const den=Math.max(t.budget,t.spent,1);$('seg').innerHTML=S.cats.map((c,i)=>{const w=(sp[c.n]||0)/den*100;return w?`<i style="width:${w}%;background:${color(i)}"></i>`:''}).join('');$('seg').setAttribute('aria-label',`Spending by category; total ${money(t.spent)}`);const select=$('cat'),old=select.value;select.innerHTML=S.cats.map(c=>`<option value="${esc(c.n)}">${esc(c.n)}</option>`).join('');if(S.cats.some(c=>c.n===old))select.value=old;
$('cats').innerHTML=S.cats.length?S.cats.map((c,i)=>{const s=sp[c.n]||0,b=Number(c.b)||0,o=s>b,p=b?Math.min(s/b*100,100):(s?100:0);return `<div class="cat"><div class="row"><b>${esc(c.n)}</b><input class="bud" type="number" min="0" step="0.01" inputmode="decimal" value="${b}" data-i="${i}" aria-label="Budget for ${esc(c.n)}"></div><div class="row meta"><span>${money(s)} spent</span><span style="color:${o?'var(--over)':'inherit'}">${o?money(s-b)+' over':money(b-s)+' left'}</span></div><div class="bar"><i style="width:${p}%;background:${o?'var(--over)':color(i)}"></i></div></div>`}).join(''):'<div class="empty">Add a category to start budgeting.</div>';
$('txs').innerHTML=tx.length?tx.map(x=>`<div class="tx"><div><b>${money(Number(x.a)||0)}</b> ${esc(x.c)}<br><small>${esc(x.d)}${x.n?' · '+esc(x.n):''}</small></div><button class="del" data-id="${esc(x.id)}" aria-label="Delete expense">×</button></div>`).join(''):'<div class="empty">No expenses for this month yet. Add one above.</div>';chart()}
$('date').value=today();$('prev').onclick=()=>{const d=dateOf(month);d.setMonth(d.getMonth()-1);month=keyOf(d);render()};$('next').onclick=()=>{const d=dateOf(month);d.setMonth(d.getMonth()+1);month=keyOf(d);render()};
$('expenseForm').onsubmit=e=>{e.preventDefault();const a=Number($('amt').value),d=$('date').value;if(!(a>0)||!d||!$('cat').value)return;S.tx.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,a:Math.round(a*100)/100,c:$('cat').value,d,n:$('note').value.trim()});save();$('amt').value='';$('note').value='';month=d.slice(0,7);render()};
$('categoryForm').onsubmit=e=>{e.preventDefault();const n=$('cname').value.trim();if(!n||S.cats.some(c=>c.n.toLowerCase()===n.toLowerCase())){$('cname').setCustomValidity('Enter a unique category name.');$('cname').reportValidity();return}S.cats.push({n,b:0});save();$('cname').value='';render()};$('cname').oninput=()=>$('cname').setCustomValidity('');
$('cats').onchange=e=>{if(!e.target.matches('[data-i]'))return;const c=S.cats[Number(e.target.dataset.i)];if(!c)return;c.b=Math.max(0,Number(e.target.value)||0);save();render()};$('txs').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;S.tx=S.tx.filter(t=>String(t.id)!==b.dataset.id);save();render()};
function themeButton(){const d=document.documentElement.dataset.theme||'system',dark=d==='dark'||(d==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);$('theme').textContent=dark?'☼':'☾';document.querySelector('meta[name=theme-color]').content=dark?'#0f1716':'#0f6b5c'}try{const th=localStorage.getItem(THEME);if(th)document.documentElement.dataset.theme=th}catch{}themeButton();$('theme').onclick=()=>{const now=document.documentElement.dataset.theme||'system',next=now==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME,next);themeButton();chart()};matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!document.documentElement.dataset.theme){themeButton();chart()}});
let promptEvent;const ib=$('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;ib.classList.add('visible')});ib.onclick=async()=>{if(!promptEvent)return;promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;ib.classList.remove('visible')};window.addEventListener('appinstalled',()=>ib.classList.remove('visible'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
